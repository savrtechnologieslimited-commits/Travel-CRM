<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SAVR Flight Import</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <div class="brand">SAVR Flight Import</div>
      <p class="intro">Bring the selected Google Flights itinerary into your CRM without retyping it.</p>
      <button id="read-flight" class="primary" type="button">Read selected flight</button>
      <section id="preview" class="preview" hidden>
        <strong id="route"></strong>
        <span id="airline"></span>
        <span id="times"></span>
        <span id="fare"></span>
        <button id="import-flight" class="primary" type="button">Import to itinerary</button>
      </section>
      <p id="status" class="status" role="status">Choose a flight in Google Flights first.</p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
